apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-prometheus
  labels:
    app: fake-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-prometheus
  template:
    metadata:
      labels:
        app: fake-prometheus
    spec:
      containers:
        - name: fake-prometheus
          image: ghcr.io/your-org/fake-prometheus:latest
          imagePullPolicy: Always
          args:
            - "--cycle-minutes=5"
          env:
            - name: PORT
              value: "9090"
            - name: FAKE_DEPLOYMENT_COUNT
              value: "1"
            - name: FAKE_FORCE_ANOMALY_EVERY_QUERY
              value: "true"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fake-prometheus
  labels:
    app: fake-prometheus
spec:
  selector:
    app: fake-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
  type: ClusterIP

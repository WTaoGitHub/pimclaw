apiVersion: apps/v1
kind: Deployment
metadata:
  name: pimclaw
  namespace: baota-playground
  labels:
    app: pimclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pimclaw
  template:
    metadata:
      labels:
        app: pimclaw
      annotations:
        heimdallr.harmonycloud.cn/ipv4hdpools-eth0: '["default-ippool"]'
        v1.multus-cni.io/default-network: default/calico-heim
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: pimclaw-persistence
          persistentVolumeClaim:
            claimName: pimclaw-pvc-test-1
      initContainers:
        - name: init-pimclaw-persistence
          image: 10.1.112.238:8443/baota/pimclaw-openclaw:latest-test-3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          command:
            - sh
            - -c
            - |
              mkdir -p /mnt/openclaw-home && \
              if [ ! -f /mnt/openclaw-home/openclaw.json ]; then \
                echo "[init] First boot: seeding openclaw-home from /app/seed-openclaw-home"; \
                cp -a /app/seed-openclaw-home/. /mnt/openclaw-home/; \
              else \
                echo "[init] Existing config found, skipping seed to preserve runtime state"; \
              fi && \
              mkdir -p /mnt/openclaw-home/state && \
              chown -R 1000:1000 /mnt/openclaw-home
          volumeMounts:
            - name: pimclaw-persistence
              mountPath: /mnt/openclaw-home
      containers:
        - name: pimclaw
          image: 10.1.112.238:8443/baota/pimclaw-openclaw:latest-test-3
          imagePullPolicy: IfNotPresent
          command:
            - openclaw
            - gateway
            - --bind
            - lan
            - --port
            - "18789"
          ports:
            - containerPort: 18789
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 5 # Reduced because startupProbe handles the boot
            timeoutSeconds: 3      # Increased to tolerate brief network/CPU spikes
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5    # Increased: allows 2.5 minutes of failure before a kill
          readinessProbe:
            tcpSocket:
              port: 18789
            timeoutSeconds: 3      # Increased tolerance for slow responses
            periodSeconds: 10      # Increased: gives the service more breathing room
            successThreshold: 1
            failureThreshold: 6    # Increased: allows 1 minute of "unready" before removal from LB
          startupProbe:
            tcpSocket:
              port: 18789
            timeoutSeconds: 3
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 30
          resources:
            limits:
              cpu: '3'
              memory: 4Gi
            requests:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: pimclaw-persistence
              mountPath: /home/node/.openclaw
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
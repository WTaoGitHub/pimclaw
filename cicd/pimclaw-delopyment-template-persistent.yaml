apiVersion: apps/v1
kind: Deployment
metadata:
  name: pimclaw
  namespace: baota-playground
  labels:
    app: pimclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pimclaw
  template:
    metadata:
      labels:
        app: pimclaw
      annotations:
        heimdallr.harmonycloud.cn/ipv4hdpools-eth0: '["default-ippool"]'
        v1.multus-cni.io/default-network: default/calico-heim
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: pimclaw-persistence
          persistentVolumeClaim:
            claimName: pimclaw-pvc-test-1
      initContainers:
        - name: init-pimclaw-persistence
          image: 10.1.112.238:8443/baota/pimclaw-openclaw:latest-test
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          command:
            - sh
            - -c
            - |
              mkdir -p /home/node/.openclaw/workspaces/pimclaw-main \
                /home/node/.openclaw/workspaces/pimclaw-head \
                /home/node/.openclaw/workspaces/pimclaw-planner \
                /home/node/.openclaw/state && \
              HOME=/home/node openclaw plugins install /app/plugins/pimclaw && \
              chown -R 1000:1000 /home/node/.openclaw
          volumeMounts:
            - name: pimclaw-persistence
              mountPath: /home/node/.openclaw
      containers:
        - name: pimclaw
          image: 10.1.112.238:8443/baota/pimclaw-openclaw:latest-test
          imagePullPolicy: Always
          ports:
            - containerPort: 18789
              protocol: TCP
          resources:
            limits:
              cpu: '3'
              memory: 4Gi
            requests:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: pimclaw-persistence
              mountPath: /home/node/.openclaw
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
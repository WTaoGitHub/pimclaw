plugins:
  pimclaw:
    enabled: true
    path: /absolute/path/to/pimclaw
    config:
      autoCreateAgents: true
      perfMcp:
        command: node
        args:
          - /absolute/path/to/perf-mcp-server.js
        env:
          PERF_SERVICE_PROFILE: production
      # Optional external runtime monitor MCP service process
      # monMcp:
      #   command: node
      #   args:
      #     - /absolute/path/to/mon-mcp-server.js
      #   env:
      #     MONITOR_TARGET: production
      # Optional external simulator MCP service process
      # simMcp:
      #   command: node
      #   args:
      #     - /absolute/path/to/sim-mcp-server.js
      #   env:
      #     SIM_PROFILE: default
